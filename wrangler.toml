name = "portfolio-v2"
main = "dist/_worker.js/index.js"
compatibility_date = "2026-11-11"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
# sidv.dev and www.sidv.dev are attached as custom domains in the dashboard.
# The main *.workers.dev URL is off so the site has one public origin; per-version
# preview URLs stay on for testing (set explicitly, they otherwise follow workers_dev).
workers_dev = false
preview_urls = true

[assets]
directory = "./dist"
binding = "ASSETS"
# Markdown content negotiation needs the Worker to see these requests before the
# matching HTML asset is served. Everything else is served straight from assets.
run_worker_first = ["/", "/blog", "/blog/*", "/resume", "/resume/"]

[observability]
enabled = true

# /rolls photo archive. The remote resources don't exist yet: deploying this config
# before they're created would let wrangler auto-provision them.
[[d1_databases]]
binding = "DB"
database_name = "rolls"
database_id = "6aca1abc-8498-4d68-83ef-5e3e3a86b3f6"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "ORIGINALS"
bucket_name = "rolls-originals"

[[r2_buckets]]
binding = "PUBLIC_IMAGES"
bucket_name = "rolls-public"

[[queues.producers]]
binding = "ROLLS_INGEST"
queue = "rolls-ingest"

# One message per invocation until CPU per message is measured.
[[queues.consumers]]
queue = "rolls-ingest"
max_batch_size = 1
max_retries = 3
dead_letter_queue = "rolls-ingest-dlq"

[images]
binding = "IMAGES"

[vars]
ROLLS_IMG_BASE = "https://img.sidv.dev"
